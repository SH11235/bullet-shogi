on:
    pull_request:
    push:
      branches:
        - main

name: cargo
jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - uses: dtolnay/rust-toolchain@stable
          with:
            components: clippy
        - run: |
            cargo clippy --workspace
            # bullet_lib は shogi_progress_kpabs_train_cuda example のために
            # cudarc を optional dep として保持している。`cuda` feature を有効に
            # すると cudarc の build.rs が nvcc を要求するが、GitHub Actions
            # runner に CUDA toolchain は無いので bullet_lib のみ exclude する。
            # 残りの crate (bullet-gpu / bullet-trainer 等) は raw FFI 経由で
            # 動くため CUDA_PATH=. のハックで clippy が通る。
            CUDA_PATH=. cargo clippy --workspace --exclude bullet_lib --features cuda
            HIP_PATH=. cargo clippy --workspace --features rocm

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - uses: dtolnay/rust-toolchain@stable
        - run: cargo test --workspace

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - uses: dtolnay/rust-toolchain@stable
          with:
            components: rustfmt
        - run: cargo fmt --all -- --check

